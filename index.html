<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF1F7">
<meta name="description" content="Squishy &amp; Friends - a tiny cute swipe puzzle. merge your squishies onto the heart!">
<title>Squishy &amp; Friends ♥</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28 C3 18 2 9 8.5 6.5 C13 4.5 16 8.5 16 12 C16 8.5 19 4.5 23.5 6.5 C30 9 29 18 16 28 Z' fill='%23FF6D9E'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #6B4A5B;
    --pink: #FF9CC0;
    --heart: #FF6D9E;
    --yel: #FFD56A;
    --border: #F6C9DC;
    /* redesign tokens */
    --logo: #FF7FAE;
    --heart-top: #FF85AC;
    --heart-edge: #E2557F;
    --soft: #8A6E7C;
    --dim: #C99BB2;
    --dim2: #C18BA8;
    --link: #C9A6B8;
    --link-ul: #EAC9D8;
    --bubble-bd: #FCDDEB;
    --shadow: rgba(246,201,220,.5);
    --shadow6: rgba(246,201,220,.6);
    --dark: #6B4A5B;
    --dark-edge: rgba(60,38,48,.45);
  }
  /* Fredoka — self-hosted (SIL OFL 1.1, see public/fonts/OFL.txt) so the
     iOS adaptation can bundle the same face; no CDN dependency */
  @font-face {
    font-family: 'Fredoka'; font-style: normal; font-weight: 300 700; font-display: swap;
    src: url('/fonts/fredoka-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Fredoka'; font-style: normal; font-weight: 300 700; font-display: swap;
    src: url('/fonts/fredoka-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* lock the text scale so a bigger iOS system font never inflates the
     layout out of shape — the tuned px sizes hold on every device */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; }
  body {
    position: fixed; inset: 0;
    background: radial-gradient(130% 90% at 50% -15%, #FFFAFC 0%, #FFEFF6 42%, #FFE2EE 100%);
    color: var(--ink);
    font: 600 14px/1.25 'Fredoka', ui-rounded, "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    letter-spacing: .02em;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
    display: flex; flex-direction: column;
  }
  body::before, body::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(3px); opacity: .5; pointer-events: none;
  }
  body::before { width: 200px; height: 200px; background: #FFE0EC; left: -60px; top: 12%; }
  body::after { width: 240px; height: 240px; background: #FFEAD6; right: -80px; bottom: 8%; }

  /* ---- logo lockup (single source of truth: src/game/logo.ts) ---- */
  .logo-heart { width: 1em; height: 1em; display: block; }
  .wordmark { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
  .wm-main {
    font-weight: 700; color: var(--logo); line-height: 1.04;
    -webkit-text-stroke: .12em #fff; paint-order: stroke fill;
    filter: drop-shadow(0 .06em 0 rgba(230,120,165,.5)); letter-spacing: .005em;
  }
  .wm-sub { font-size: .3em; font-weight: 700; color: var(--ink); letter-spacing: .06em; margin-top: -.08em; }
  .wm-sub b { color: var(--heart); font-weight: 700; }

  header {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top));
  }
  #brand { display: flex; align-items: center; gap: 10px; min-width: 0; cursor: pointer; }
  #home {
    flex: none; width: 44px; height: 44px; border-radius: 15px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: #fff; color: var(--heart); box-shadow: 0 5px 0 var(--shadow6);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  #home:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow6); }
  #home .logo-heart { width: 24px; height: 24px; }
  #logo { display: flex; min-width: 0; }
  #logo .wordmark { font-size: 23px; }
  #hud { display: flex; align-items: center; gap: 10px; flex: none; }
  #lvl {
    font-size: 14px; color: var(--dim2); font-weight: 700; letter-spacing: .04em;
    background: #fff; border-radius: 999px; padding: 5px 14px;
    box-shadow: 0 4px 0 var(--shadow); white-space: nowrap;
  }
  #moves { font-size: 17px; flex: none; white-space: nowrap; }
  #moves b { font-weight: 700; color: var(--ink); }
  #moves b.over { color: var(--heart); }
  .dim { color: var(--dim); font-weight: 700; }

  #main { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
  /* the board is dead-centre in the play area; messages float above it */
  canvas { display: block; }
  /* Squishy's speech bubble — every notification is "spoken" from above the
     board with a soft down-tail and a gentle talking sway. Centred via auto
     margins so the sway owns `transform`. */
  #cap, #toast {
    position: absolute; top: 8px; left: 0; right: 0; margin-inline: auto;
    width: fit-content; max-width: calc(100% - 28px); z-index: 6;
    background: #fff; border: 2px solid var(--bubble-bd); border-radius: 18px;
    padding: 9px 18px; font-size: 14px; font-weight: 600; color: var(--soft);
    line-height: 1.25; text-align: center; pointer-events: none;
    box-shadow: 0 12px 22px -10px rgba(255,109,158,.4);
    opacity: 0; transition: opacity .26s ease; transform-origin: center bottom;
  }
  #cap.show, #toast.show { opacity: 1; animation: sf-talk 2.6s ease-in-out infinite; }
  #cap b, #toast b { color: var(--heart); font-weight: 700; }
  #cap.bad, #toast.bad { color: var(--heart); border-color: #FFB7CE; }
  /* a toast takes the stage — the caption politely dips until it's gone */
  #cap.mute { opacity: 0; animation: none; }
  #cap::before, #toast::before, #cap::after, #toast::after {
    content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0;
  }
  #cap::before, #toast::before { bottom: -13px; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 13px solid var(--bubble-bd); }
  #cap::after,  #toast::after  { bottom: -9px;  border-left: 8px solid transparent;  border-right: 8px solid transparent;  border-top: 10px solid #fff; }
  @keyframes sf-talk { 0%, 100% { transform: translateY(0) rotate(-1.4deg); } 50% { transform: translateY(-3px) rotate(1.4deg); } }

  #flood { position: absolute; inset: 0; background: var(--pink); clip-path: circle(0px at 50% 50%); pointer-events: none; z-index: 5; }
  #fade {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background: linear-gradient(180deg, #FFF6FA, #FFE9F2);
    opacity: 0; transition: opacity .24s ease;
  }
  #fade.show { opacity: .95; }

  #intro {
    position: fixed; inset: 0; z-index: 7; display: none;
    align-items: center; justify-content: center; overflow-y: auto;
    padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom));
    background: rgba(255,240,247,.55);
  }
  #intro.show { display: flex; }
  #introCard {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: #fff; border: 2px solid var(--border); border-radius: 28px;
    padding: 18px 22px 14px; box-shadow: 0 10px 0 rgba(246,201,220,.45);
    animation: cardpop .3s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes cardpop { 0% { transform: scale(.82); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  #introP { width: 96px; height: 96px; }
  #introName { font-size: 19px; font-weight: 800; color: var(--heart); letter-spacing: .06em; }
  #introLine { font-size: 13px; color: #C18BA8; max-width: 230px; text-align: center; }
  #introTap { font-size: 11px; color: #D7B9C7; margin-top: 4px; animation: tappulse 1.4s ease-in-out infinite; }
  @keyframes tappulse { 50% { opacity: .45; } }

  /* unified win card — one celebration for campaign and daily */
  #win {
    position: fixed; inset: 0; z-index: 8; display: none;
    align-items: center; justify-content: center; overflow-y: auto;
    padding: max(10px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
    background: rgba(107,74,91,.28);
  }
  #win.show { display: flex; }
  #winCard {
    display: flex; flex-direction: column; align-items: center; gap: 10px; margin: auto;
    width: min(340px, 92vw); background: #fff; border-radius: 30px; padding: 22px 22px 20px;
    box-shadow: 0 14px 0 var(--shadow); animation: sf-pop .35s cubic-bezier(.2,1.4,.4,1) both;
  }
  #winTitle { font-size: 36px; font-weight: 700; color: var(--heart); letter-spacing: .01em; }
  #winSub { font-size: 15px; font-weight: 600; color: var(--dim2); text-align: center; }
  #winSub b { color: var(--ink); font-weight: 700; }
  #winShot { width: 100%; border-radius: 18px; display: block; }
  #winTag { font-size: 15px; font-weight: 700; color: var(--ink); text-align: center; }
  #winBtns { display: flex; gap: 10px; width: 100%; margin-top: 4px; }
  #winBtns button {
    font: inherit; flex: 1; border: none; cursor: pointer; border-radius: 18px;
    padding: 13px 0; font-size: 15px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  #winShare { background: linear-gradient(180deg, var(--heart-top), var(--heart)); box-shadow: 0 5px 0 var(--heart-edge); }
  #winShare:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--heart-edge); }
  #winNext { background: var(--dark); box-shadow: 0 5px 0 var(--dark-edge); }
  #winNext:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--dark-edge); }
  #winShare svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }

  #start, #levels {
    position: fixed; inset: 0; z-index: 8; display: none;
    flex-direction: column; align-items: center; overflow-y: auto;
    padding: max(8px, env(safe-area-inset-top)) 0 max(8px, env(safe-area-inset-bottom));
    background: radial-gradient(130% 90% at 50% -15%, #FFFAFC 0%, #FFEFF6 42%, #FFE2EE 100%);
  }
  #start.show, #levels.show { display: flex; }
  #levels { z-index: 9; }
  /* margin:auto centers when there is room and scrolls cleanly when not —
     nothing is ever cut off */
  #startInner, #levelsInner {
    display: flex; flex-direction: column; align-items: center; margin: auto; padding: 24px 18px;
  }
  #levelsInner { gap: clamp(10px, 2.4vh, 18px); }
  #startInner { gap: clamp(12px, 2.8vh, 22px); width: min(360px, 92vw); }
  #startLogo .wordmark { font-size: clamp(46px, 15vw, 64px); }
  #startc { width: min(300px, 80vw); height: clamp(80px, 14vh, 112px); }
  #nextUp {
    display: flex; align-items: center; gap: 14px;
    background: #fff; border-radius: 22px; padding: 11px 18px; box-shadow: 0 6px 0 var(--shadow6);
  }
  .nu-grid { display: grid; grid-template-columns: repeat(3, 13px); grid-auto-rows: 13px; gap: 4px; flex: none; }
  .nu-grid i { border-radius: 4px; background: #FCE3EE; }
  .nu-grid i.mid { background: #ECD6E1; }
  .nu-grid i.on { background: var(--heart); }
  .nu-text { line-height: 1.12; }
  .nu-label { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--dim); }
  #nuLevel { font-size: 20px; font-weight: 700; color: var(--ink); }
  #startBtns { display: flex; flex-direction: column; gap: 12px; width: min(300px, 86vw); }
  #startBtns button {
    font: inherit; border: none; cursor: pointer; border-radius: 22px;
    background: #fff; color: var(--ink); font-size: 17px; font-weight: 600; letter-spacing: .03em;
    padding: 14px 0; box-shadow: 0 5px 0 var(--shadow6);
    transition: transform .08s ease, box-shadow .08s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  #startBtns button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow6); }
  #startBtns #bplay {
    flex-direction: column; gap: 1px; line-height: 1.04; padding: 13px 0 15px; border-radius: 24px;
    background: linear-gradient(180deg, var(--heart-top), var(--heart)); color: #fff;
    box-shadow: 0 6px 0 var(--heart-edge), 0 12px 18px -8px rgba(255,109,158,.6);
  }
  #startBtns #bplay:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--heart-edge); }
  .bp-main { font-size: 24px; font-weight: 700; }
  .bp-sub { font-size: 13px; font-weight: 600; letter-spacing: .08em; opacity: .92; }
  #bdailyDate { font-size: 12px; font-weight: 600; color: var(--dim); }
  #breset {
    font: inherit; background: none; border: none; cursor: pointer; margin-top: 2px;
    font-size: 13px; font-weight: 500; color: var(--link); letter-spacing: .04em; padding: 8px 10px;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; text-decoration-color: var(--link-ul);
  }
  #levelsTitle { font-size: 22px; font-weight: 800; color: var(--heart); letter-spacing: .1em; }
  #levelsGrid {
    display: grid; grid-template-columns: repeat(5, 52px); gap: 10px;
    max-height: 56vh; overflow-y: auto; padding: 6px;
  }
  .lvchip {
    width: 52px; height: 52px; border-radius: 16px; cursor: pointer;
    background: #fff; border: 2px solid var(--border);
    box-shadow: 0 4px 0 rgba(246,201,220,.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: inherit; font-size: 14px; font-weight: 800; color: var(--ink); gap: 1px;
  }
  .lvchip:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(246,201,220,.45); }
  .lvchip.locked { opacity: .42; pointer-events: none; }
  .lvchip .mini { font-size: 8px; color: var(--heart); letter-spacing: 1px; height: 9px; }
  #blback {
    font: inherit; font-size: 14px; font-weight: 800; color: var(--ink);
    background: #fff; border: 2px solid var(--border); border-radius: 999px;
    padding: 9px 26px; cursor: pointer; box-shadow: 0 4px 0 rgba(246,201,220,.5);
  }
  #home {
    background: none; border: none; cursor: pointer; padding: 0 6px 0 0;
    font-size: 19px; line-height: 1; color: var(--heart);
  }
  .rate { display: flex; gap: 6px; justify-content: center; }
  .rate .rh { width: 26px; height: 24px; transform: scale(.6); transition: transform .35s cubic-bezier(.2,1.6,.4,1); }
  .rate .rh path { fill: #F1D7E3; transition: fill .3s; }
  .rate .rh.on { transform: scale(1); }
  .rate .rh.on path { fill: var(--yel); }
  .rate .rh.on:nth-child(2) { transition-delay: .1s; }
  .rate .rh.on:nth-child(3) { transition-delay: .2s; }

  footer {
    position: relative; z-index: 1; display: flex; gap: 16px; justify-content: center;
    align-items: flex-start;
    padding: 10px 22px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  footer button {
    width: 54px; height: 54px; flex: none; border: none;
    display: flex; align-items: center; justify-content: center;
    background: #fff; color: var(--heart); border-radius: 20px;
    cursor: pointer; box-shadow: 0 6px 0 var(--shadow6);
    transition: transform .08s ease, box-shadow .08s ease, background .12s;
  }
  footer button svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  footer button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shadow6); }
  .tool .lbl { display: none; font-size: 11px; font-weight: 600; color: var(--dim); letter-spacing: .02em; }
  footer.labels .tool .lbl { display: block; }
  footer button#hint.on {
    background: linear-gradient(180deg, var(--heart-top), var(--heart)); color: #fff;
    box-shadow: 0 6px 0 var(--heart-edge), 0 10px 14px -6px rgba(255,109,158,.5);
  }
  footer button#hint.on:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--heart-edge); }
  footer button#mute.off { color: var(--dim); background: #FBEEF3; }
  footer button#mute .wave { transition: opacity .12s; }
  footer button#mute.off .wave { opacity: 0; }
  footer button#mute .slash { opacity: 0; }
  footer button#mute.off .slash { opacity: 1; }

  .shake { animation: shake .55s linear; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    15% { transform: translate(-7px,2px); } 30% { transform: translate(6px,-3px); }
    45% { transform: translate(-5px,-2px); } 60% { transform: translate(4px,3px); }
    75% { transform: translate(-3px,1px); } 90% { transform: translate(2px,-1px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .shake { animation: none; } footer button { transition: none; }
    .rate .rh { transition: none; }
    #cap.show, #toast.show { animation: none; }
    #winCard { animation: none; }
    #fade { transition: none; }
    #introCard { animation: none; } #introTap { animation: none; }
  }
</style>
</head>
<body>
<header>
  <div id="brand">
    <button id="home" aria-label="home"></button>
    <span id="logo"></span>
  </div>
  <div id="hud">
    <div id="lvl">01</div>
    <div id="moves"><b>0</b><span class="dim">/1</span></div>
  </div>
</header>
<main id="main">
  <canvas id="c"></canvas>
  <div id="cap"></div>
  <div id="toast"></div>
  <div id="fade"></div>
  <div id="flood"></div>
</main>
<footer>
  <div class="tool">
    <button id="undo" aria-label="undo">
      <svg viewBox="0 0 24 24"><path d="M10 8 L5 12.5 L10 17"/><path d="M5 12.5 H14 a4.5 4.5 0 0 1 4.5 4.5"/></svg>
    </button>
    <span class="lbl">Undo</span>
  </div>
  <div class="tool">
    <button id="retry" aria-label="retry">
      <svg viewBox="0 0 24 24"><path d="M18.5 8.5 A7 7 0 1 0 19.5 14"/><path d="M19 4 V9 H14"/></svg>
    </button>
    <span class="lbl">Retry</span>
  </div>
  <div class="tool">
    <button id="hint" aria-label="hint">
      <svg viewBox="0 0 24 24"><path d="M12 3 a6 6 0 0 1 6 6 c0 2.2-1.2 3.5-2.2 4.6-.8.9-1.3 1.5-1.3 2.4 H9.5 c0-.9-.5-1.5-1.3-2.4C7.2 12.5 6 11.2 6 9 a6 6 0 0 1 6-6 Z"/><path d="M9.8 19.5 h4.4"/><path d="M10.5 21.5 h3"/></svg>
    </button>
    <span class="lbl">Hint</span>
  </div>
  <div class="tool">
    <button id="mute" aria-label="sound">
      <svg viewBox="0 0 24 24"><path d="M5 9.5 H8 L12.5 6 V18 L8 14.5 H5 Z" fill="currentColor" stroke="none"/><path class="wave" d="M16 9.5 a4 4 0 0 1 0 5"/><path class="wave" d="M18.4 7.5 a7 7 0 0 1 0 9"/><path class="slash" d="M16 9 L21 15 M21 9 L16 15"/></svg>
    </button>
    <span class="lbl">Sound</span>
  </div>
</footer>
<!-- full-screen overlays live at body level so they sit above header/footer
     (a child of #main is trapped in its stacking context and the footer,
     a same-z sibling, would paint over it) -->
<div id="intro">
  <div id="introCard">
    <canvas id="introP" width="96" height="96"></canvas>
    <div id="introName"></div>
    <canvas id="introD"></canvas>
    <div id="introLine"></div>
    <div id="introTap">Tap to play</div>
  </div>
</div>
<div id="win">
  <div id="winCard">
    <div id="winTitle">You did it!</div>
    <div id="winSub"></div>
    <canvas id="winShot"></canvas>
    <div id="winTag"></div>
    <div id="winBtns">
      <button id="winShare"><svg viewBox="0 0 24 24"><path d="M12 15 V4"/><path d="M8.5 7.5 L12 4 L15.5 7.5"/><path d="M6 12 V18.5 H18 V12"/></svg>Share</button>
      <button id="winNext">Next →</button>
    </div>
  </div>
</div>
<div id="start">
  <div id="startInner">
    <span id="startLogo"></span>
    <canvas id="startc"></canvas>
    <div id="nextUp">
      <div class="nu-grid"><i></i><i class="on"></i><i></i><i></i><i class="mid"></i><i></i><i></i><i></i><i class="on"></i></div>
      <div class="nu-text"><div class="nu-label">NEXT UP</div><div id="nuLevel">Level 1</div></div>
    </div>
    <div id="startBtns">
      <button id="bplay"><span class="bp-main">Play</span><span class="bp-sub" id="bplaySub">LEVEL 1</span></button>
      <button id="blevels">Levels</button>
      <button id="bdaily">Daily <span id="bdailyDate"></span></button>
    </div>
    <button id="breset">Reset progress</button>
  </div>
</div>
