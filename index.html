<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF1F7">
<meta name="description" content="Squishy &amp; Friends - a tiny cute swipe puzzle. merge your squishies onto the heart!">
<title>Squishy &amp; Friends ♥</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28 C3 18 2 9 8.5 6.5 C13 4.5 16 8.5 16 12 C16 8.5 19 4.5 23.5 6.5 C30 9 29 18 16 28 Z' fill='%23FF6D9E'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #6B4A5B;
    --pink: #FF9CC0;
    --heart: #FF6D9E;
    --yel: #FFD56A;
    --border: #F6C9DC;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    position: fixed; inset: 0;
    background: radial-gradient(130% 90% at 50% -15%, #FFFAFC 0%, #FFEFF6 42%, #FFE2EE 100%);
    color: var(--ink);
    font: 800 14px/1.25 ui-rounded, "Hiragino Maru Gothic ProN", "Quicksand", "Varela Round", system-ui, sans-serif;
    letter-spacing: .02em;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none; overscroll-behavior: none;
    display: flex; flex-direction: column;
  }
  body::before, body::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(3px); opacity: .5; pointer-events: none;
  }
  body::before { width: 200px; height: 200px; background: #FFE0EC; left: -60px; top: 12%; }
  body::after { width: 240px; height: 240px; background: #FFEAD6; right: -80px; bottom: 8%; }

  header {
    position: relative; z-index: 1; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top));
  }
  #brand {
    font-weight: 800; font-size: 16px; letter-spacing: .04em;
    display: flex; align-items: center;
    flex: 1 1 auto; min-width: 0; overflow: hidden; white-space: nowrap;
  }
  #brand b { color: var(--heart); font-size: 11px; margin-left: 5px; letter-spacing: .06em; }
  #lvl {
    font-size: 12px; color: #C18BA8; font-weight: 800; letter-spacing: .08em;
    background: #fff; border: 2px solid var(--border); border-radius: 999px;
    padding: 4px 12px; box-shadow: 0 3px 0 rgba(246,201,220,.45);
    flex: none; white-space: nowrap;
  }
  #starpill {
    font-size: 12px; color: #E8AE32; font-weight: 800; letter-spacing: .08em;
    background: #fff; border: 2px solid #F4D389; border-radius: 999px;
    padding: 4px 10px; box-shadow: 0 3px 0 rgba(244,211,137,.45);
    flex: none; white-space: nowrap;
  }
  #starpill.bump { animation: bump .4s cubic-bezier(.2,1.6,.4,1); }
  @keyframes bump { 30% { transform: scale(1.25); } 100% { transform: scale(1); } }
  #moves { font-size: 16px; flex: none; white-space: nowrap; text-align: right; }
  #moves b { font-weight: 800; color: var(--ink); }
  #moves b.over { color: var(--heart); }
  .dim { color: #CDA4B7; font-weight: 800; }

  #main { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
  /* the board sits a bit high — the strip below it belongs to messages */
  canvas { display: block; margin-bottom: 88px; }
  #cap {
    position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
    max-width: calc(100% - 24px); text-align: center;
    font-size: 12px; color: #C18BA8; font-weight: 800; letter-spacing: .04em;
    background: #fff; border: 2px solid var(--border); border-radius: 999px;
    padding: 7px 16px; box-shadow: 0 3px 0 rgba(246,201,220,.4);
    pointer-events: none; opacity: 0; transition: opacity .4s ease;
  }
  #cap.show { opacity: 1; }
  #cap.bad { color: var(--heart); }
  /* a toast takes the stage — the caption politely dips until it's gone */
  #cap.mute { opacity: 0; }

  #toast {
    position: absolute; left: 50%; bottom: 54px;
    transform: translate(-50%, 10px) scale(.88);
    background: #fff; border: 2px solid var(--border); border-radius: 999px;
    padding: 9px 18px; font-size: 14px; font-weight: 800; color: var(--ink);
    letter-spacing: .04em; white-space: nowrap; max-width: calc(100% - 28px);
    overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 5px 0 rgba(246,201,220,.5);
    opacity: 0; pointer-events: none; z-index: 6;
    transition: opacity .22s ease, transform .26s cubic-bezier(.2,1.4,.4,1);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #toast.bad { color: var(--heart); border-color: #FFB7CE; }
  #toast.bad.show { animation: tug .42s ease; }
  @keyframes tug {
    0%, 100% { rotate: 0deg; }
    25% { rotate: -2.4deg; } 55% { rotate: 2.2deg; } 80% { rotate: -1.2deg; }
  }

  #flood { position: absolute; inset: 0; background: var(--pink); clip-path: circle(0px at 50% 50%); pointer-events: none; z-index: 5; }
  #fade {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background: linear-gradient(180deg, #FFF6FA, #FFE9F2);
    opacity: 0; transition: opacity .24s ease;
  }
  #fade.show { opacity: .95; }

  #intro {
    position: absolute; inset: 0; z-index: 7; display: none;
    align-items: center; justify-content: center;
    background: rgba(255,240,247,.55);
  }
  #intro.show { display: flex; }
  #introCard {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: #fff; border: 2px solid var(--border); border-radius: 28px;
    padding: 18px 22px 14px; box-shadow: 0 10px 0 rgba(246,201,220,.45);
    animation: cardpop .3s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes cardpop { 0% { transform: scale(.82); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  #introP { width: 96px; height: 96px; }
  #introName { font-size: 19px; font-weight: 800; color: var(--heart); letter-spacing: .06em; }
  #introLine { font-size: 13px; color: #C18BA8; max-width: 230px; text-align: center; }
  #introTap { font-size: 11px; color: #D7B9C7; margin-top: 4px; animation: tappulse 1.4s ease-in-out infinite; }
  @keyframes tappulse { 50% { opacity: .45; } }

  #dailyWin {
    position: absolute; inset: 0; z-index: 7; display: none;
    align-items: center; justify-content: center; overflow-y: auto;
  }
  #dailyWin.show { display: flex; }
  #dwCardBox {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: #fff; border: 2px solid var(--border); border-radius: 28px;
    padding: 18px 22px 16px; margin: auto;
    box-shadow: 0 10px 0 rgba(246,201,220,.45);
    animation: cardpop .3s cubic-bezier(.2,1.4,.4,1) both;
  }
  #dwTitle { font-size: 26px; font-weight: 800; color: var(--heart); letter-spacing: .05em; }
  #dwMoves { font-size: 14px; color: #C18BA8; font-weight: 800; }
  #dwCard { border-radius: 14px; border: 2px solid var(--border); }
  #dwBtns { display: flex; gap: 10px; margin-top: 6px; }
  #dwBtns button {
    font: inherit; font-size: 15px; font-weight: 800; letter-spacing: .05em;
    padding: 11px 22px; border-radius: 999px; cursor: pointer;
    background: #fff; color: var(--ink); border: 2px solid var(--border);
    box-shadow: 0 4px 0 rgba(246,201,220,.5);
  }
  #dwBtns button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(246,201,220,.5); }
  #dwBtns #dwShare {
    background: var(--heart); color: #fff; border-color: #F04F88;
    box-shadow: 0 4px 0 rgba(226,101,143,.55);
  }

  #start, #levels {
    position: absolute; inset: 0; z-index: 8; display: none;
    flex-direction: column; align-items: center; overflow-y: auto;
    background: radial-gradient(130% 90% at 50% -15%, #FFFAFC 0%, #FFEFF6 42%, #FFE2EE 100%);
  }
  #start.show, #levels.show { display: flex; }
  #levels { z-index: 9; }
  /* margin:auto centers when there is room and scrolls cleanly when not —
     nothing is ever cut off */
  #startInner, #levelsInner {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(10px, 2.4vh, 18px); margin: auto; padding: 18px 14px;
  }
  #startTitle { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  #st1 {
    font-size: clamp(34px, 11vw, 48px); font-weight: 800; color: var(--heart);
    letter-spacing: .04em; transform: rotate(-2.5deg);
    text-shadow: 0 3px 0 rgba(240,79,136,.18);
  }
  #st2 {
    font-size: clamp(15px, 4.6vw, 20px); font-weight: 800; color: var(--ink);
    letter-spacing: .12em; margin-top: -7px; transform: rotate(-2.5deg);
    background: linear-gradient(180deg, rgba(255,250,252,0) 0%, rgba(255,250,252,.85) 45%);
    padding: 2px 8px; border-radius: 8px;
  }
  #startc { width: min(320px, 84vw); height: clamp(84px, 15vh, 118px); }
  #startBtns { display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 12px); width: min(240px, 72vw); }
  #startBtns button {
    font: inherit; font-size: 16px; font-weight: 800; letter-spacing: .06em;
    padding: clamp(10px, 1.8vh, 13px) 0; border-radius: 999px; cursor: pointer;
    background: #fff; color: var(--ink); border: 2px solid var(--border);
    box-shadow: 0 5px 0 rgba(246,201,220,.5);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  #startBtns button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(246,201,220,.5); }
  #startBtns #bplay {
    background: var(--heart); color: #fff; border-color: #F04F88;
    box-shadow: 0 6px 0 rgba(226,101,143,.55); font-size: 18px;
  }
  #bdailyDate { font-size: 11px; color: #CDA4B7; font-weight: 800; }
  #levelsTitle { font-size: 22px; font-weight: 800; color: var(--heart); letter-spacing: .1em; }
  #levelsGrid {
    display: grid; grid-template-columns: repeat(5, 52px); gap: 10px;
    max-height: 56vh; overflow-y: auto; padding: 6px;
  }
  .lvchip {
    width: 52px; height: 52px; border-radius: 16px; cursor: pointer;
    background: #fff; border: 2px solid var(--border);
    box-shadow: 0 4px 0 rgba(246,201,220,.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: inherit; font-size: 14px; font-weight: 800; color: var(--ink); gap: 1px;
  }
  .lvchip:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(246,201,220,.45); }
  .lvchip.locked { opacity: .42; pointer-events: none; }
  .lvchip .mini { font-size: 8px; color: var(--heart); letter-spacing: 1px; height: 9px; }
  #blback {
    font: inherit; font-size: 14px; font-weight: 800; color: var(--ink);
    background: #fff; border: 2px solid var(--border); border-radius: 999px;
    padding: 9px 26px; cursor: pointer; box-shadow: 0 4px 0 rgba(246,201,220,.5);
  }
  #home {
    background: none; border: none; cursor: pointer; padding: 0 6px 0 0;
    font-size: 19px; line-height: 1; color: var(--heart);
  }
  #msg {
    position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; color: #fff;
    opacity: 0; pointer-events: none; transition: opacity .15s linear; text-align: center;
  }
  #msg.show { opacity: 1; }
  #msg.show #msgbig { animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
  #msgbig { font-size: 42px; font-weight: 800; text-shadow: 0 3px 0 rgba(0,0,0,.07); }
  #msgsub { font-size: 14px; font-weight: 800; }
  .rate { display: flex; gap: 8px; justify-content: center; }
  .rate .rh { width: 30px; height: 28px; transform: scale(.6); transition: transform .35s cubic-bezier(.2,1.6,.4,1); }
  .rate .rh path { fill: rgba(255,255,255,.4); transition: fill .3s; }
  .rate .rh.on { transform: scale(1); }
  .rate .rh.on path { fill: var(--yel); }
  .rate .rh.on:nth-child(2) { transition-delay: .1s; }
  .rate .rh.on:nth-child(3) { transition-delay: .2s; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  footer {
    position: relative; z-index: 1; display: flex; gap: 14px; justify-content: center;
    padding: 14px 22px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  footer button {
    width: 58px; height: 58px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: #fff; color: var(--ink);
    border: 2px solid var(--border); border-radius: 50%;
    cursor: pointer; box-shadow: 0 5px 0 rgba(246,201,220,.5);
    transition: transform .08s ease, box-shadow .08s ease, background .12s;
  }
  footer button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  footer button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(246,201,220,.5); background: #FFF0F5; }
  footer button#hint { color: #E8A93C; }
  footer button#hint.on {
    background: #FFF6E3; border-color: #F4D389;
    animation: hintglow 1.6s ease-in-out infinite;
  }
  @keyframes hintglow {
    0%, 100% { box-shadow: 0 5px 0 rgba(232,169,60,.35); }
    50% { box-shadow: 0 5px 0 rgba(232,169,60,.35), 0 0 16px rgba(255,213,106,.85); }
  }
  footer button#mute.off { color: #D7B9C7; background: #FBEEF3; }
  footer button#mute .wave { transition: opacity .12s; }
  footer button#mute.off .wave { opacity: 0; }
  footer button#mute .slash { opacity: 0; }
  footer button#mute.off .slash { opacity: 1; }

  .shake { animation: shake .55s linear; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    15% { transform: translate(-7px,2px); } 30% { transform: translate(6px,-3px); }
    45% { transform: translate(-5px,-2px); } 60% { transform: translate(4px,3px); }
    75% { transform: translate(-3px,1px); } 90% { transform: translate(2px,-1px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .shake { animation: none; } #msg, footer button { transition: none; }
    #msg.show #msgbig { animation: none; } .rate .rh { transition: none; }
    #toast { transition: opacity .2s ease; } #toast.bad.show { animation: none; }
    #fade { transition: none; } footer button#hint.on { animation: none; }
    #introCard { animation: none; } #introTap { animation: none; }
  }
</style>
</head>
<body>
<header>
  <div id="brand"><button id="home" aria-label="menu">♥</button>Squishy <b>&amp; Friends</b></div>
  <div id="lvl">01</div>
  <div id="starpill" hidden></div>
  <div id="moves"><b>0</b><span class="dim">/1</span></div>
</header>
<main id="main">
  <canvas id="c"></canvas>
  <div id="cap"></div>
  <div id="toast"></div>
  <div id="fade"></div>
  <div id="intro">
    <div id="introCard">
      <canvas id="introP" width="96" height="96"></canvas>
      <div id="introName"></div>
      <canvas id="introD"></canvas>
      <div id="introLine"></div>
      <div id="introTap">Tap to play</div>
    </div>
  </div>
  <div id="flood"></div>
  <div id="msg"><div id="msgbig"></div><div id="msgsub"></div></div>
  <div id="dailyWin">
    <div id="dwCardBox">
      <div id="dwTitle">Congrats!</div>
      <div id="dwMoves"></div>
      <canvas id="dwCard"></canvas>
      <div id="dwBtns">
        <button id="dwShare">Share</button>
        <button id="dwContinue">Keep playing</button>
      </div>
    </div>
  </div>
  <div id="start">
    <div id="startInner">
      <div id="startTitle"><span id="st1">Squishy</span><span id="st2">&amp; Friends</span></div>
      <canvas id="startc"></canvas>
      <div id="startBtns">
        <button id="bplay">Play</button>
        <button id="blevels">Levels</button>
        <button id="bdaily">Daily <span id="bdailyDate"></span></button>
      </div>
    </div>
  </div>
  <div id="levels">
    <div id="levelsInner">
      <div id="levelsTitle">Levels</div>
      <div id="levelsGrid"></div>
      <button id="blback">Back</button>
    </div>
  </div>
</main>
<footer>
  <button id="undo" aria-label="undo">
    <svg viewBox="0 0 24 24"><path d="M10 8 L5 12.5 L10 17"/><path d="M5 12.5 H14 a4.5 4.5 0 0 1 4.5 4.5"/></svg>
  </button>
  <button id="retry" aria-label="retry">
    <svg viewBox="0 0 24 24"><path d="M18.5 8.5 A7 7 0 1 0 19.5 14"/><path d="M19 4 V9 H14"/></svg>
  </button>
  <button id="hint" aria-label="hint">
    <svg viewBox="0 0 24 24"><path d="M12 3 a6 6 0 0 1 6 6 c0 2.2-1.2 3.5-2.2 4.6-.8.9-1.3 1.5-1.3 2.4 H9.5 c0-.9-.5-1.5-1.3-2.4C7.2 12.5 6 11.2 6 9 a6 6 0 0 1 6-6 Z"/><path d="M9.8 19.5 h4.4"/><path d="M10.5 21.5 h3"/></svg>
  </button>
  <button id="mute" aria-label="sound">
    <svg viewBox="0 0 24 24"><path d="M5 9.5 H8 L12.5 6 V18 L8 14.5 H5 Z" fill="currentColor" stroke="none"/><path class="wave" d="M16 9.5 a4 4 0 0 1 0 5"/><path class="wave" d="M18.4 7.5 a7 7 0 0 1 0 9"/><path class="slash" d="M16 9 L21 15 M21 9 L16 15"/></svg>
  </button>
</footer>
<script type="module" src="/src/game/main.ts"></script>
</body>
</html>
